# MaxouJeux — fichier prêt à coller sur le NAS UGREEN.
#
# Contrairement à `docker-compose.yml` (qui lit un fichier `.env`), celui-ci a
# toutes ses valeurs en clair : il suffit de le coller dans l'application Docker
# d'UGOS, ou de l'enregistrer en `docker-compose.yml` dans un dossier du NAS.
#
# ── À FAIRE AVANT DE DÉMARRER ────────────────────────────────────────────────
#
#   1. Remplacer les deux valeurs REMPLACE_MOI ci-dessous. Les générer avec :
#
#        openssl rand -base64 24      → POSTGRES_PASSWORD
#        openssl rand -base64 48      → SESSION_SECRET
#
#      SESSION_SECRET déconnecte tous les joueurs si elle change :
#      la générer une fois, puis ne plus y toucher.
#
#   2. Vérifier que les images GHCR sont bien publiques
#      (GitHub → Packages → maxoujeux-api → Package settings → Public),
#      sinon un `docker login ghcr.io` est nécessaire sur le NAS.
#
# ── UTILISATION ─────────────────────────────────────────────────────────────
#
#   Démarrer        : docker compose up -d
#   Mettre à jour   : docker compose pull && docker compose up -d
#   Revenir en arrière : remplacer `:latest` par `:sha-abc1234` sur les deux
#                        images (étiquette visible dans le récapitulatif du
#                        workflow « Images Docker » sur GitHub), puis up -d
#   Journaux        : docker compose logs -f api
#
# ── PUBLICATION ─────────────────────────────────────────────────────────────
#
#   Ni TLS ni domaine ici : Nginx Proxy Manager, déjà en place sur le NAS,
#   termine le HTTPS. Y créer un Proxy Host :
#     - Domaine        : maxoujeux.maxencecoeur.fr
#     - Forward vers   : <IP du NAS> port 8080
#     - Websockets     : ACTIVÉ  ← sans ça, aucune partie ne se connecte
#     - SSL            : certificat Let's Encrypt + Force SSL
#
# ─────────────────────────────────────────────────────────────────────────────

name: maxoujeux

services:
  db:
    image: postgres:16-alpine
    container_name: maxoujeux-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=maxoujeux
      - POSTGRES_USER=maxoujeux
      - POSTGRES_PASSWORD=REMPLACE_MOI_MOT_DE_PASSE_POSTGRES
      - TZ=Europe/Paris
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxoujeux -d maxoujeux"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Aucun port publié : la base n'est jointe que par l'API, sur le réseau Docker.
    networks: [internal]

  api:
    image: ghcr.io/maxcoeur/maxoujeux-api:latest
    container_name: maxoujeux-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Le mot de passe doit être identique à celui du service db ci-dessus.
      - DATABASE_URL=postgres://maxoujeux:REMPLACE_MOI_MOT_DE_PASSE_POSTGRES@db:5432/maxoujeux
      - SESSION_SECRET=REMPLACE_MOI_CLE_DE_SESSION_48_CARACTERES_MINIMUM
      - SESSION_TTL_DAYS=30
      # Origine telle que la voit le navigateur, donc en https via NPM.
      - PUBLIC_ORIGIN=https://maxoujeux.maxencecoeur.fr
      # MaxouCoin offerts à l'inscription.
      - STARTING_BALANCE=5000
      - LOG_LEVEL=info
      # Confort de lecture des journaux. La logique MaxouCoin nomme
      # Europe/Paris explicitement dans le code et n'en dépend pas.
      - TZ=Europe/Paris
    # Aucun port publié : l'API n'est jointe qu'à travers le service web.
    networks: [internal]
    # Garde-fou mémoire : une fuite dans une partie ne doit pas emporter le NAS.
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    image: ghcr.io/maxcoeur/maxoujeux-web:latest
    container_name: maxoujeux-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - TZ=Europe/Paris
    ports:
      # Cible unique de Nginx Proxy Manager. Port 8080 et non 80 : NPM occupe
      # déjà 80 et 443 sur le NAS.
      - "8080:80"
    networks: [internal]

volumes:
  # Les comptes et les MaxouCoin des joueurs vivent ici. Ce volume survit aux
  # mises à jour ; le supprimer efface tout.
  pgdata:

networks:
  internal:
    driver: bridge
