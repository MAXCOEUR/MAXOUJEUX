# Nginx interne au conteneur `web`.
#
# Rôle volontairement limité : servir le front statique et regrouper /api et
# /socket.io derrière la même origine. Il ne fait **ni TLS, ni certificat, ni
# nom de domaine** — c'est Nginx Proxy Manager, déjà en place sur le NAS, qui
# s'en charge en amont.
#
# Pourquoi ce nginx malgré NPM : le front, l'API et les WebSockets doivent
# partager une origine unique, sinon le cookie de session ne suit pas le
# handshake Socket.IO. NPM n'a ainsi qu'une seule cible à connaître : ce
# conteneur, sur le port 80.

server {
    listen 80;
    server_name _;

    root /srv;
    index index.html;

    # NPM impose déjà une limite en amont ; celle-ci protège l'API si le
    # conteneur est joint directement depuis le réseau local.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité. Le HSTS n'est pas défini ici : il relève de la
    # terminaison TLS, donc de NPM.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    server_tokens off;

    # Sonde interne du HEALTHCHECK Docker, jamais exposée publiquement.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # --- API REST ------------------------------------------------------------
    location /api/ {
        # `resolver` + variable : nginx résout `api` à chaque requête au lieu de
        # figer l'IP au démarrage. Sans cela, un redémarrage du conteneur api
        # provoquerait des 502 jusqu'au redémarrage de nginx.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream api:3000;
        proxy_pass http://$api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Chaîne d'IP réelle : NPM l'a déjà renseignée, on la prolonge.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # --- WebSockets ----------------------------------------------------------
    location /socket.io/ {
        resolver 127.0.0.11 valid=10s;
        set $ws_upstream api:3000;
        proxy_pass http://$ws_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Une partie de poker peut rester silencieuse plusieurs minutes : un
        # délai court couperait la socket entre deux mains.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Le temps réel ne supporte pas la mise en tampon.
        proxy_buffering off;
    }

    # --- Front statique ------------------------------------------------------
    # Fichiers hachés par Vite : contenu immuable, cache d'un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html jamais mis en cache, sinon un déploiement laisserait les
    # navigateurs sur l'ancienne version indéfiniment.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Application monopage : toute route inconnue retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
